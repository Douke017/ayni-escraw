<div 
  class="ayni-qr"
  [style.width.px]="size()"
  [style.height.px]="size()"
>
  @if (qrDataUrl()) {
    <img 
      [src]="qrDataUrl()" 
      [alt]="alt()" 
      class="ayni-qr__image"
      loading="lazy"
    />
  } @else if (isError()) {
    <div class="ayni-qr__error flex items-center justify-center gap-1.5 text-xs text-rose-500">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>Error al generar QR</span>
    </div>
  } @else {
    <div class="ayni-qr__placeholder">
      <span class="ayni-qr__spinner"></span>
    </div>
  }
</div>
