services:
  postgres:
    image: postgres:16
    container_name: ayni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayni_db}
      POSTGRES_USER: ${POSTGRES_USER:-ayni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayni_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayni_user} -d ${POSTGRES_DB:-ayni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayni_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: ayni_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ayni_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ayni_minio_secret_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ayni_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 \${MINIO_ACCESS_KEY:-ayni_minio_admin} \${MINIO_SECRET_KEY:-ayni_minio_secret_pass_2026};
      /usr/bin/mc mb --ignore-existing local/ayni-listings-public;
      /usr/bin/mc mb --ignore-existing local/ayni-evidence-private;
      /usr/bin/mc mb --ignore-existing local/ayni-checklists;
      /usr/bin/mc mb --ignore-existing local/ayni-proof-of-listing;
      /usr/bin/mc anonymous set download local/ayni-listings-public;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ayni_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ayni_db}
      POSTGRES_USER: ${POSTGRES_USER:-ayni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayni_secure_pass_2026}
      REDIS_CONNECTION: redis:6379,abortConnect=false
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ayni_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-ayni_minio_secret_pass_2026}
      MINIO_WITH_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-Ayni_Super_Secret_Key_For_Jwt_Token_Authentication_2026_Minimum_32_Bytes_Long!}
      JWT_ISSUER: ${JWT_ISSUER:-AyniBackend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AyniFrontend}
      HSK_RPC_URL: ${HSK_RPC_URL:-https://testnet.hsk.xyz}
      ARBITRATOR_ADDRESS: ${ARBITRATOR_ADDRESS:-0x70997970C51812dc3A010C7d01b50e0d17dc79C8}
      PYTHON_PATH: /app/ai-agents/.venv/bin/python3
      AI_AGENTS_RUNNER_PATH: /app/ai-agents/runner.py
      DIDIT_API_KEY: ${DIDIT_API_KEY:-}
      DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
      DIDIT_CALLBACK_URL: ${DIDIT_CALLBACK_URL:-http://localhost:4200/verify/done}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY:-e377abab503103bd941c96573b04b5b3ac2d10db5f97693ab9238121e0bff78b}
      AGENT_ADDRESS: ${AGENT_ADDRESS:-0x6582dCD2587C6094C0Fb3ce986035B1a4157D59a}
      AYNI_REGISTRY_ADDRESS: ${AYNI_REGISTRY_ADDRESS:-0x7C9842A474Ad2da1a74FDe2D448fAcf393be54b2}
      WEB3_MOCK_MODE: "false"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ayni_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
