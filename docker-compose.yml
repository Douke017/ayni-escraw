services:
  postgres:
    image: postgres:16
    container_name: ayni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayni_db}
      POSTGRES_USER: ${POSTGRES_USER:-ayni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayni_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayni_user} -d ${POSTGRES_DB:-ayni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayni_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: ayni_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ayni_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ayni_minio_secret_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ayni_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 \${MINIO_ACCESS_KEY:-ayni_minio_admin} \${MINIO_SECRET_KEY:-ayni_minio_secret_pass_2026};
      /usr/bin/mc mb --ignore-existing local/ayni-listings-public;
      /usr/bin/mc mb --ignore-existing local/ayni-evidence-private;
      /usr/bin/mc mb --ignore-existing local/ayni-checklists;
      /usr/bin/mc mb --ignore-existing local/ayni-proof-of-listing;
      /usr/bin/mc anonymous set download local/ayni-listings-public;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
