[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "permit2/=lib/permit2/",
    "forge-std/=lib/forge-std/src/"
]

fs_permissions = [
    { access = "read-write", path = "./" }
]

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC:-https://testnet.hsk.xyz}"
hsk_mainnet = "${HSK_MAINNET_RPC:-https://mainnet.hsk.xyz}"
